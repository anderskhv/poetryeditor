<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Poetry Editor — Write, Analyze & Get Coached</title>
    <meta name="description" content="Write poetry with real-time analysis and AI coaching. Get feedback on rhythm, rhyme, imagery, and craft from an editor that learns your voice. Free syllable counter, rhyme dictionary, meter analysis, and more." />
    <meta name="keywords" content="poetry editor, AI poetry coach, poetry feedback, poetry writing tool, syllable counter, rhyme scheme detector, meter analyzer, poetry analysis, sonnet checker, haiku validator, poetry coaching, writing feedback" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Poetry Editor — Write, Analyze & Get Coached" />
    <meta property="og:description" content="Write poetry with real-time analysis and AI coaching. Get feedback on craft, imagery, and voice from an editor that learns how you work." />
    <meta property="og:url" content="https://poetryeditor.com" />
    <meta property="og:site_name" content="Poetry Editor" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://poetryeditor.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Poetry Editor - Free online poetry analysis tool" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Poetry Editor — Write, Analyze & Get Coached" />
    <meta name="twitter:description" content="Write poetry with real-time analysis and AI coaching. Get feedback on craft, imagery, and voice from an editor that learns how you work." />
    <meta name="twitter:image" content="https://poetryeditor.com/og-image.png" />
    <meta name="twitter:image:alt" content="Poetry Editor - Free online poetry analysis tool" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://poetryeditor.com" />

    <!-- Structured Data - WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Poetry Editor",
      "url": "https://poetryeditor.com",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "description": "Write poetry with real-time analysis and AI coaching. Get feedback on rhythm, rhyme, imagery, and craft from an editor that learns your voice.",
      "image": "https://poetryeditor.com/og-image.png",
      "screenshot": "https://poetryeditor.com/og-image.png",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "AI poetry coaching with personalized feedback",
        "Real-time poetry analysis (rhythm, rhyme, meter, style)",
        "Syllable counter",
        "Rhyme dictionary",
        "Rhyme scheme detector",
        "Meter analyzer and scansion tool",
        "Haiku checker (5-7-5 validator)",
        "Sonnet validator (Shakespearean and Petrarchan)",
        "Collection-level editorial letters"
      ],
      "softwareVersion": "2.0"
    }
    </script>

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Poetry Editor",
      "url": "https://poetryeditor.com",
      "sameAs": []
    }
    </script>

    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Poetry Editor",
      "url": "https://poetryeditor.com",
      "potentialAction": [
        {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://poetryeditor.com/rhymes/{search_term_string}"
          },
          "query-input": "required name=search_term_string"
        },
        {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://poetryeditor.com/syllables/{search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      ]
    }
    </script>

    <!-- Fonts: preconnect + preload to eliminate FOUC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Critical inline CSS: prevents flash of white/unstyled background -->
    <style>
      :root {
        --color-background: #f4f2ef;
        --color-paper: #fdfcfa;
        --color-text-primary: #2a2a2a;
        --font-serif: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: #f4f2ef;
        color: #2a2a2a;
        font-family: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        background-color: #f4f2ef;
      }
      /* Hide content until React hydrates — prevents raw HTML flash */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::after {
        content: '';
        display: block;
        width: 24px;
        height: 24px;
        border: 2px solid #ccc;
        border-top-color: #888;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
